    The Spyne Unified API accepts vehicle images and video (by SKU / VIN /
    stock number) and returns AI-transformed studio images, background
    replacement, 360-degree spins, and feature videos, plus image
    classification and QC. Jobs are submitted with a Bearer token; results are
    retrieved by polling or delivered via signed webhook callbacks.
