aid: spyne
name: Spyne
description: >-
  Spyne is an AI platform for automotive retail that helps car dealerships and
  marketplaces produce studio-grade vehicle visuals and merchandising at scale.
  Its Unified API and mobile SDKs let developers submit raw vehicle images and
  video and receive AI-transformed studio images, background replacement,
  360-degree spins, feature videos, and automated image classification and QC.
  Processing is asynchronous - jobs are submitted per SKU/VIN and results are
  delivered via polling endpoints or signed webhook callbacks. Spyne also offers
  conversational AI agents for dealership sourcing, listing, marketing, and
  selling vehicles faster.
